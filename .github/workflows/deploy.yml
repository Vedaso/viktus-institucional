# Publica viktus.com.br a cada push na main.
#
# Antes disto o deploy era um comando na mão. O gate em scripts/check-build.mjs pegava o build
# sem commit, mas nada pegava o inverso: main commitada e produção parada num commit anterior,
# porque o site velho também devolve 200 — foi o que aconteceu em 17/07/2026. O passo `provar`
# no fim busca viktus.com.br e exige encontrar o commit que acabou de subir.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: publicar no Pages
        run: npx wrangler pages deploy dist/ --project-name viktus-institucional --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: provar que produção é este commit
        run: |
          esperado="${GITHUB_SHA:0:7}"
          for tentativa in $(seq 1 12); do
            visto=$(curl -sf https://viktus.com.br/ \
              | grep -o 'name="build-commit" content="[^"]*"' \
              | sed 's/.*content="//;s/"//') || visto=''
            if [ "$visto" = "$esperado" ]; then
              echo "produção está em $visto"
              exit 0
            fi
            echo "tentativa $tentativa: produção responde '$visto', esperado '$esperado'"
            sleep 10
          done
          echo "::error::produção não chegou em $esperado depois de 2 minutos"
          exit 1
