<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .v-dark { display: none }
    @media (prefers-color-scheme: dark) {
      .v-light { display: none }
      .v-dark { display: block }
    }
  </style>
  <image class="v-light" x="0" y="0" width="100" height="100" href="data:image/png;base64,"/>
  <image class="v-dark" x="0" y="0" width="100" height="100" href="data:image/png;base64,"/>
</svg>
